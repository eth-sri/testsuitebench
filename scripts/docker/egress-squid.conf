http_port 3128

# Only CONNECT to 443 on the allowlisted API hosts. Everything else is denied,
# so an agent container can reach its model API and nothing else -- no github,
# no crates.io, no upstream source for the program it is meant to reverse
# engineer.
acl agent_api dstdomain .openai.com .chatgpt.com .anthropic.com .googleapis.com openrouter.ai api.z.ai zcode.z.ai
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !SSL_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT agent_api
http_access allow agent_api
http_access deny all

# No caching: agent traffic must not be stored on the host.
cache deny all
access_log none
